<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LandShield Pro</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#080f1e">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<style>
:root{
  --bg:#080f1e; --panel:#12203a; --panel2:#0d1a2e; --line:#213555;
  --gold:#e0b989; --blue:#3aa8e0; --text:#eef2f8; --muted:#8fa0bf;
  --ok:#3ecf8e; --warn:#e3b341; --danger:#ef6a6a;
  --shadow:0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text)}
body{display:flex;justify-content:center;min-height:100%}
#phone{width:100%;max-width:420px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}
header.topbar{padding:20px 20px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(8,15,30,.9);backdrop-filter:blur(8px);z-index:5}
.brand{display:flex;align-items:center;gap:11px}
.brand .hex{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--gold),#a9773f);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:var(--shadow)}
.brand h1{font-size:16px;margin:0;font-weight:700}
.brand small{color:var(--muted);font-size:11px;display:block}
.role-pill{font-size:11px;padding:6px 12px;border-radius:20px;background:var(--panel);color:var(--muted);cursor:pointer}
main{flex:1;padding:6px 18px 96px;overflow-y:auto}
h2.section{font-size:13px;color:var(--muted);margin:24px 2px 12px;font-weight:700;letter-spacing:.2px}
h2.section:first-child{margin-top:6px}
.hero{border-radius:20px;padding:20px;margin-bottom:14px;background:linear-gradient(135deg,#1b3a63,#0e2340 70%);box-shadow:var(--shadow)}
.hero .tag{font-size:11px;color:#bcd6ee;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.hero h3{font-size:19px;margin:6px 0 12px}
.hero .meta-row{display:flex;gap:14px;font-size:11px;color:#bcd6ee;margin-bottom:14px}
.hero button{background:var(--gold);border:none;color:#22160a;font-weight:700;padding:10px 16px;border-radius:10px;font-size:13px}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stat .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;margin-bottom:8px}
.stat b{font-size:20px;display:block}
.stat span{font-size:11px;color:var(--muted)}
.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa{background:var(--panel);border-radius:16px;padding:14px;box-shadow:var(--shadow);cursor:pointer}
.qa .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:8px}
.qa b{font-size:12.5px;display:block}
.qa span{font-size:10.5px;color:var(--muted)}
.list-card{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.row-item:last-child{border-bottom:none}
.row-item .body{flex:1;min-width:0}
.row-item b{font-size:13.5px;display:block}
.row-item .meta{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-item .chev{color:var(--muted);font-size:16px}
.badge{font-size:10px;padding:4px 9px;border-radius:20px;font-weight:700;white-space:nowrap}
.b-pend{background:rgba(227,179,65,.16);color:var(--warn)}
.b-proc{background:rgba(58,168,224,.16);color:var(--blue)}
.b-ok{background:rgba(62,207,142,.16);color:var(--ok)}
.chart-card{background:var(--panel);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.chart-card .big{font-size:22px;font-weight:700}
.bars{display:flex;align-items:flex-end;gap:8px;height:70px;margin-top:14px}
.bars .bar{flex:1;background:linear-gradient(180deg,var(--blue),#1c5f85);border-radius:5px 5px 0 0;min-height:4px}
.bars-labels{display:flex;gap:8px;margin-top:6px}
.bars-labels span{flex:1;text-align:center;font-size:9px;color:var(--muted)}
select,input,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font-size:14px;margin-bottom:12px;font-family:inherit}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;font-weight:600}
button.primary{width:100%;background:linear-gradient(90deg,var(--blue),#1c5f85);border:none;color:#fff;padding:15px;border-radius:13px;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
button.ghost{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--danger);padding:13px;border-radius:13px;font-size:13px;margin-top:10px;font-weight:600}
.err{color:var(--danger);font-size:12px;margin:-4px 0 12px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--blue);color:var(--text);padding:11px 18px;border-radius:12px;font-size:12px;z-index:20;max-width:90%;text-align:center;box-shadow:var(--shadow)}
nav.bottom{position:fixed;bottom:0;width:100%;max-width:420px;background:rgba(10,18,35,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:9px 4px}
nav.bottom button{flex:1;background:none;border:none;color:var(--muted);font-size:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:5px}
nav.bottom button.active{color:var(--blue)}
nav.bottom button.active.gold{color:var(--gold)}
nav.bottom .ic{font-size:19px}
#login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 28px}
#login .center{text-align:center}
#login .hex{width:66px;height:66px;border-radius:20px;background:linear-gradient(135deg,var(--gold),#a9773f);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 20px;box-shadow:var(--shadow)}
#login h1{font-size:27px;margin:0;font-weight:800}
#login p{color:var(--muted);font-size:13px;margin:8px 0 28px}
.role-btn{width:100%;text-align:left;background:var(--panel);border-radius:16px;padding:17px;margin-bottom:12px;display:flex;align-items:center;gap:13px;cursor:pointer;box-shadow:var(--shadow)}
.role-btn .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.role-btn.client .ic{background:rgba(58,168,224,.16);color:var(--blue)}
.role-btn.admin .ic{background:rgba(224,185,137,.16);color:var(--gold)}
.role-btn b{display:block;font-size:14.5px}
.role-btn span{font-size:11px;color:var(--muted)}
a{color:var(--blue);text-decoration:none}
.hint{font-size:11px;color:var(--muted);margin-top:-8px;margin-bottom:14px}
.backlink{font-size:12px;color:var(--muted);margin-top:6px;display:inline-block;cursor:pointer}
.loading{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--muted);font-size:13px}
.avatar{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--blue),#1c5f85);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff}
.profile-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.profile-head b{font-size:16px;display:block}
.profile-head span{font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);font-size:12px;padding:26px 10px}
.icwrap{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
</style>
</head>
<body>
<div id="phone"><div class="loading">Cargando LandShield Pro…</div></div>
<script>
const S = {
  token: localStorage.getItem('ls_token') || null,
  role: localStorage.getItem('ls_role') || null,
  clienteId: localStorage.getItem('ls_cliente') || null,
  empresa: localStorage.getItem('ls_empresa') || null,
  view: 'select', tab: 'home', loginErr: '',
  tickets: [], clientes: [], equipos: [], toast: ''
};
async function api(path, opts={}){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(S.token) headers['Authorization'] = 'Bearer '+S.token;
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  return res.json();
}
async function loadData(){
  const [t, m] = await Promise.all([api('/api/tickets'), api('/api/meta')]);
  if(t.ok) S.tickets = t.tickets;
  if(m.ok){ S.clientes = m.clientes; S.equipos = m.equipos; }
}
function showToast(msg){ S.toast = msg; render(); setTimeout(()=>{ S.toast=''; render(); }, 3500); }
async function boot(){
  if(S.token && S.role){ S.view='app'; await loadData(); }
  render();
}
function render(){
  const p = document.getElementById('phone');
  if(!S.role || S.view!=='app'){ p.innerHTML = loginFlow() + (S.toast?`<div class="toast">${S.toast}</div>`:''); return; }
  p.innerHTML = `
    <header class="topbar">
      <div class="brand"><div class="hex">🔒</div><div><h1>LandShield Pro</h1><small>${S.role==='admin'?'Panel Administrador':S.empresa}</small></div></div>
      <div class="role-pill" onclick="logout()">Salir</div>
    </header>
    <main>${S.role==='admin'?adminView():clientView()}</main>
    ${bottomNav()}
    ${S.toast?`<div class="toast">${S.toast}</div>`:''}`;
}
function loginFlow(){
  if(S.view==='select') return `<div id="login"><div class="center">
    <div class="hex">🔒</div><h1>LandShield Pro</h1>
    <p>Soluciones corporativas de TI &amp; seguridad</p></div>
    <div class="role-btn client" onclick="S.view='client-login';render()"><div class="ic">👤</div><div><b>Ingresar como Cliente</b><span>Usuario y contraseña de tu empresa</span></div></div>
    <div class="role-btn admin" onclick="S.view='admin-login';render()"><div class="ic">🛡️</div><div><b>Ingresar como Administrador</b><span>Usuario y contraseña de LandShield</span></div></div>
  </div>`;
  if(S.view==='client-login') return loginForm('Cliente','cliente','Ej: textiles-andina / ta2026');
  if(S.view==='admin-login') return loginForm('Administrador','admin','admin / (contraseña configurada)');
  return '';
}
function loginForm(label, role, hint){
  return `<div id="login"><div class="center"><div class="hex">🔒</div><h1>Acceso ${label}</h1>
  <p>Ingresa tus credenciales</p></div>
  <label>Usuario</label><input id="lu" placeholder="usuario">
  <label>Contraseña</label><input id="lp" type="password" placeholder="contraseña">
  ${S.loginErr?`<div class="err">${S.loginErr}</div>`:''}
  <button class="primary" onclick="doLogin('${role}')">Ingresar</button>
  <div class="hint">Credenciales de prueba: ${hint}</div>
  <a class="backlink" onclick="S.view='select';S.loginErr='';render()">← volver</a>
  </div>`;
}
async function doLogin(role){
  const user=document.getElementById('lu').value.trim(), password=document.getElementById('lp').value;
  const r = await api('/api/login', {method:'POST', body: JSON.stringify({role, user, password})});
  if(!r.ok){ S.loginErr = r.error || 'Error de acceso'; render(); return; }
  S.token=r.token; S.role=r.role; S.clienteId=r.clienteId; S.empresa=r.empresa;
  localStorage.setItem('ls_token', r.token); localStorage.setItem('ls_role', r.role);
  localStorage.setItem('ls_cliente', r.clienteId||''); localStorage.setItem('ls_empresa', r.empresa||'');
  S.view='app'; S.tab='home'; S.loginErr='';
  await loadData(); render();
}
function logout(){ localStorage.clear(); Object.assign(S,{token:null,role:null,clienteId:null,empresa:null,view:'select'}); render(); }
function bottomNav(){
  if(S.role==='admin') return `<nav class="bottom">
    ${navBtn('home','📊','Panel','gold')}${navBtn('tickets','🎫','Tickets','gold')}
    ${navBtn('clientes','🏢','Clientes','gold')}${navBtn('equipos','🖥️','Equipos','gold')}
    ${navBtn('perfil','⚙️','Perfil','gold')}</nav>`;
  return `<nav class="bottom">
    ${navBtn('home','🏠','Inicio')}${navBtn('solicitar','➕','Solicitar')}
    ${navBtn('mistickets','🎫','Tickets')}${navBtn('misequipos','🖥️','Equipos')}
    ${navBtn('perfil','☎️','Soporte')}</nav>`;
}
function navBtn(tab,icon,label,cls){
  const active = S.tab===tab ? 'active'+(cls?' '+cls:''):'';
  return `<button class="${active}" onclick="go('${tab}')"><span class="ic">${icon}</span>${label}</button>`;
}
function go(tab){ S.tab=tab; render(); }
const dot = s => s==='ok'?'🟢':s==='warn'?'🟡':'🔴';
const badge = s => s==='pend'?'<span class="badge b-pend">Pendiente</span>':s==='proc'?'<span class="badge b-proc">En proceso</span>':'<span class="badge b-ok">Resuelto</span>';
const iconBg = s => s==='pend'?'rgba(227,179,65,.16)':s==='proc'?'rgba(58,168,224,.16)':'rgba(62,207,142,.16)';
const iconFg = s => s==='pend'?'var(--warn)':s==='proc'?'var(--blue)':'var(--ok)';
const clienteById = id => S.clientes.find(c=>c.clienteId===id) || {empresa:id};
function initials(name){ return (name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function ticketRow(t, withClient){
  const c = withClient ? clienteById(t.clienteId).empresa : null;
  return `<div class="row-item">
    <div class="icwrap" style="background:${iconBg(t.status)};color:${iconFg(t.status)}">🎫</div>
    <div class="body"><b>${t.id}${c?' · '+c:''}</b><div class="meta">${t.svc}</div></div>
    ${badge(t.status)}
  </div>`;
}
function clientView(){
  const mt = S.tickets, me = S.equipos;
  if(S.tab==='home') return `
    <div class="hero">
      <div class="tag">Bienvenido</div>
      <h3>${S.empresa}</h3>
      <div class="meta-row"><span>🎫 ${mt.length} tickets</span><span>🖥️ ${me.length} equipos</span></div>
      <button onclick="go('solicitar')">Solicitar servicio →</button>
    </div>
    <h2 class="section">Servicios</h2>
    <div class="qa-grid">
      <div class="qa" onclick="go('solicitar')"><div class="ic" style="background:rgba(58,168,224,.16);color:var(--blue)">🛠</div><b>Preventivo</b><span>Mantenimiento</span></div>
      <div class="qa" onclick="go('solicitar')"><div class="ic" style="background:rgba(239,106,106,.16);color:var(--danger)">⚡</div><b>Correctivo</b><span>Soporte urgente</span></div>
      <div class="qa" onclick="go('solicitar')"><div class="ic" style="background:rgba(224,185,137,.16);color:var(--gold)">🛡</div><b>Seguridad</b><span>Respaldo</span></div>
      <div class="qa" onclick="go('solicitar')"><div class="ic" style="background:rgba(62,207,142,.16);color:var(--ok)">🎧</div><b>Asistencia</b><span>Mesa de ayuda</span></div>
    </div>
    <h2 class="section">Último ticket</h2>
    <div class="list-card">${mt[0]?ticketRow(mt[0]):'<div class="empty">Aún no tienes tickets.</div>'}</div>`;
  if(S.tab==='solicitar') return `
    <h2 class="section">Solicitar servicio</h2>
    <div class="list-card" style="padding:16px">
      <label>Tipo de servicio</label>
      <select id="svcType"><option>Mantenimiento Preventivo</option><option>Soporte Correctivo</option><option>Seguridad y Respaldo</option><option>Asistencia Corporativa</option></select>
      <label>Describe el problema o necesidad</label>
      <textarea id="svcDesc" rows="4" placeholder="Ej: El servidor SRV-02 no enciende..."></textarea>
      <button class="primary" onclick="crearTicket()">Enviar solicitud</button>
    </div>`;
  if(S.tab==='mistickets') return `<h2 class="section">Mis tickets</h2>
    <div class="list-card">${mt.length? mt.map(t=>ticketRow(t)).join('') : '<div class="empty">No tienes tickets todavía.</div>'}</div>`;
  if(S.tab==='misequipos') return `<h2 class="section">Mis equipos</h2>
    <div class="list-card">${me.length? me.map(e=>`<div class="row-item"><div class="icwrap" style="background:var(--panel2)">${dot(e.estado)}</div><div class="body"><b>${e.serie}</b><div class="meta">${e.modelo}</div></div></div>`).join('') : '<div class="empty">No hay equipos registrados.</div>'}</div>`;
  if(S.tab==='perfil') return `
    <div class="profile-head"><div class="avatar">${initials(S.empresa)}</div><div><b>${S.empresa}</b><span>Cliente LandShield Pro</span></div></div>
    <h2 class="section">Contacto y soporte</h2>
    <div class="list-card">
      <a href="https://wa.me/51993032328" target="_blank" class="row-item" style="text-decoration:none;color:inherit"><div class="icwrap" style="background:rgba(62,207,142,.16);color:var(--ok)">💬</div><div class="body"><b>WhatsApp</b><div class="meta">+51 993 032 328</div></div><span class="chev">›</span></a>
      <a href="mailto:jlandas3115@gmail.com" class="row-item" style="text-decoration:none;color:inherit"><div class="icwrap" style="background:rgba(58,168,224,.16);color:var(--blue)">✉️</div><div class="body"><b>Email</b><div class="meta">jlandas3115@gmail.com</div></div><span class="chev">›</span></a>
    </div>
    <h2 class="section">Cuenta</h2>
    <button class="ghost" onclick="logout()">Cerrar sesión</button>`;
  return '';
}
function adminView(){
  if(S.tab==='home'){
    const pend = S.tickets.filter(t=>t.status==='pend').length;
    const proc = S.tickets.filter(t=>t.status==='proc').length;
    const ok = S.tickets.filter(t=>t.status==='ok').length;
    const max = Math.max(pend,proc,ok,1);
    return `
    <h2 class="section">Panel general</h2>
    <div class="stat-row">
      <div class="stat"><div class="ic" style="background:rgba(58,168,224,.16);color:var(--blue)">🎫</div><b>${S.tickets.length}</b><span>Tickets totales</span></div>
      <div class="stat"><div class="ic" style="background:rgba(224,185,137,.16);color:var(--gold)">🏢</div><b>${S.clientes.length}</b><span>Clientes activos</span></div>
    </div>
    <h2 class="section">Estado de tickets</h2>
    <div class="chart-card">
      <div class="big">${S.tickets.length} <span style="font-size:12px;color:var(--muted);font-weight:400">este periodo</span></div>
      <div class="bars">
        <div class="bar" style="height:${pend/max*100}%;background:linear-gradient(180deg,var(--warn),#8a6a1c)"></div>
        <div class="bar" style="height:${proc/max*100}%"></div>
        <div class="bar" style="height:${ok/max*100}%;background:linear-gradient(180deg,var(--ok),#1c7a52)"></div>
      </div>
      <div class="bars-labels"><span>Pendiente</span><span>En proceso</span><span>Resuelto</span></div>
    </div>
    <h2 class="section">Actividad reciente</h2>
    <div class="list-card">${S.tickets.slice(0,4).map(t=>ticketRow(t,true)).join('') || '<div class="empty">Sin actividad todavía.</div>'}</div>`;
  }
  if(S.tab==='tickets') return `<h2 class="section">Todos los tickets</h2>
    <div class="list-card">${S.tickets.map(t=>`<div class="row-item" style="flex-wrap:wrap">
        <div class="icwrap" style="background:${iconBg(t.status)};color:${iconFg(t.status)}">🎫</div>
        <div class="body"><b>${t.id} · ${clienteById(t.clienteId).empresa}</b><div class="meta">${t.svc} — ${t.desc}</div></div>
        <select onchange="cambiarEstado('${t.id}',this.value)" style="width:auto;margin:0;padding:6px 8px;font-size:11px;border-radius:8px">
          <option value="pend" ${t.status==='pend'?'selected':''}>Pendiente</option>
          <option value="proc" ${t.status==='proc'?'selected':''}>En proceso</option>
          <option value="ok" ${t.status==='ok'?'selected':''}>Resuelto</option>
        </select></div>`).join('') || '<div class="empty">No hay tickets.</div>'}</div>`;
  if(S.tab==='clientes') return `<h2 class="section">Clientes</h2>
    <div class="list-card">${S.clientes.map(c=>`<div class="row-item" style="cursor:pointer" onclick='abrirFormCliente(${JSON.stringify(c).replace(/'/g,"&apos;")})'><div class="avatar" style="width:38px;height:38px;font-size:13px;border-radius:11px">${initials(c.empresa)}</div><div class="body"><b>${c.empresa}</b><div class="meta">Plan ${c.plan} · ${c.user}</div></div><span class="badge b-proc">${S.tickets.filter(t=>t.clienteId===c.clienteId).length}</span><span class="chev">›</span></div>`).join('')}</div>
    <button class="primary" style="margin-top:14px" onclick="abrirFormCliente(null)">+ Nuevo cliente</button>`;
  if(S.tab==='cliente-form'){
    const c = S.editCliente || {};
    return `<h2 class="section">${c.clienteId?'Editar cliente':'Nuevo cliente'}</h2>
    <div class="list-card" style="padding:16px">
      <label>ID único (sin espacios)</label><input id="cf_id" value="${c.clienteId||''}" ${c.clienteId?'disabled':''} placeholder="ej: mi-empresa">
      <label>Nombre de la empresa</label><input id="cf_empresa" value="${c.empresa||''}" placeholder="Mi Empresa SAC">
      <label>Plan</label><input id="cf_plan" value="${c.plan||'Corporativo'}">
      <label>Teléfono (con código de país, sin +)</label><input id="cf_telefono" value="${c.telefono||''}" placeholder="51999888777">
      <label>Email</label><input id="cf_email" value="${c.email||''}" placeholder="contacto@empresa.pe">
      <label>Usuario de acceso</label><input id="cf_user" value="${c.user||''}" placeholder="usuario">
      <label>Contraseña ${c.clienteId?'(dejar vacío para no cambiarla)':''}</label><input id="cf_pass" type="password" placeholder="••••••">
      <div id="cf_err" class="err" style="display:none"></div>
      <button class="primary" onclick="guardarCliente()">Guardar</button>
      <a class="backlink" onclick="S.tab='clientes';S.editCliente=null;render()">← volver</a>
    </div>`;
  }
  if(S.tab==='equipos') return `<h2 class="section">Inventario de equipos</h2>
    <div class="list-card">${S.equipos.map(e=>`<div class="row-item"><div class="icwrap" style="background:var(--panel2)">${dot(e.estado)}</div><div class="body"><b>${e.serie}</b><div class="meta">${e.modelo} · ${e.resp} · ${clienteById(e.clienteId).empresa}</div></div></div>`).join('')}</div>`;
  if(S.tab==='perfil') return `
    <div class="profile-head"><div class="avatar">AD</div><div><b>Administrador</b><span>LandShield Pro</span></div></div>
    <h2 class="section">Cuenta</h2>
    <div class="list-card"><div class="row-item"><div class="icwrap" style="background:var(--panel2)">✉️</div><div class="body"><b>jlandas3115@gmail.com</b><div class="meta">Correo de la cuenta</div></div></div></div>
    <button class="ghost" onclick="logout()">Cerrar sesión</button>`;
  return '';
}
function abrirFormCliente(c){ S.editCliente = c; S.tab='cliente-form'; render(); }
async function guardarCliente(){
  const errBox = document.getElementById('cf_err');
  const payload = {
    clienteId: document.getElementById('cf_id').value.trim(),
    empresa: document.getElementById('cf_empresa').value.trim(),
    plan: document.getElementById('cf_plan').value.trim(),
    telefono: document.getElementById('cf_telefono').value.trim(),
    email: document.getElementById('cf_email').value.trim(),
    user: document.getElementById('cf_user').value.trim(),
    password: document.getElementById('cf_pass').value
  };
  if(!payload.clienteId || !payload.empresa || !payload.user){
    errBox.style.display='block'; errBox.textContent='Completa empresa, ID y usuario.'; return;
  }
  const r = await api('/api/clientes-admin', {method:'POST', body: JSON.stringify(payload)});
  if(!r.ok){ errBox.style.display='block'; errBox.textContent=r.error||'Error al guardar'; return; }
  await loadData(); S.tab='clientes'; S.editCliente=null;
  showToast(r.updated?'Cliente actualizado.':'Cliente creado. Ya puede iniciar sesión.');
}
async function crearTicket(){
  const svc = document.getElementById('svcType').value;
  const desc = document.getElementById('svcDesc').value || 'Sin descripción.';
  const r = await api('/api/tickets', {method:'POST', body: JSON.stringify({svc, desc})});
  if(r.ok){ await loadData(); S.tab='mistickets'; showToast('Ticket creado correctamente.'); }
}
async function cambiarEstado(id, status){
  const r = await api('/api/ticket-status', {method:'POST', body: JSON.stringify({id, status})});
  if(r.ok){
    await loadData();
    if(r.notified.email || r.notified.whatsapp){
      showToast('Cliente notificado automáticamente por ' + [r.notified.email&&'email', r.notified.whatsapp&&'WhatsApp'].filter(Boolean).join(' y '));
    } else {
      showToast('Estado actualizado (notificación automática no configurada).');
    }
  }
}
boot();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
</script>
